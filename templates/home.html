<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        input,
        button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .history-btn {
            display: inline-block;
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .history-btn:hover {
            background: #15803d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>House Price Prediction</h1>
        <p>Enter house details to predict the price.</p>

        <form method="POST">
            {% csrf_token %}

            <input type="number" name="area" placeholder="Area (sq. ft.)" min="1" step="any" required>

            <input type="number" name="bedrooms" placeholder="Bedrooms" min="1" step="1" required>

            <input type="number" name="bathrooms" placeholder="Bathrooms" min="1" step="1" required>

            <input type="number" name="age" placeholder="Age (years)" min="0" step="any" required>

            <button type="submit">Predict Price</button>

            <a href="/history/" class="history-btn">See History</a>

        </form>

        {% if prediction is not None %}
        <h2>Predicted House Price</h2>
        <h1>₹ {{ prediction }} Lakh</h1>
        {% endif %}

        {% if error %}
        <p style="color: red;">{{ error }}</p>
        {% endif %}

    </div>
</body>

</html>
